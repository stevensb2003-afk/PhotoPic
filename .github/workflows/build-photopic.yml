name: Build PhotoPic (macOS & Windows)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS (Apple Silicon DMG + Verify)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile macOS Swift Targets
        run: |
          BEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | grep -v -i beta | sort -V | tail -n 1 || true)
          if [ -n "$BEST_XCODE" ] && [ -d "$BEST_XCODE/Contents/Developer" ]; then
            sudo xcode-select -s "$BEST_XCODE/Contents/Developer"
          fi
          SWIFT_VER=$(swift --version | head -n 1)
          XCODES=$(ls -d /Applications/Xcode*.app 2>/dev/null | tr '\n' ' ')
          echo "::notice::Selected=$(xcode-select -p) | Swift=$SWIFT_VER | Available=$XCODES"
          set -o pipefail
          swift build 2>&1 | tee /tmp/swift_build.log || {
            python3 - <<'PY'
          import re
          lines = open("/tmp/swift_build.log", "r", encoding="utf-8", errors="replace").read().splitlines()
          emitted = 0
          for line in lines:
              m = re.match(r"^(.*?):(\d+):(\d+):\s+error:\s+(.*)$", line)
              if m and emitted < 12:
                  path, ln, col, msg = m.groups()
                  print(f"::error file={path},line={ln},col={col}::{msg}")
                  emitted += 1
          for line in lines[-25:]:
              if emitted < 20 and ("While " in line or "error:" in line or "0.\t" in line or "1.\t" in line or "2.\t" in line or "3.\t" in line):
                  print(f"::error::{line}")
                  emitted += 1
          PY
            exit 1
          }

      - name: Run PhotoPicVerify
        run: swift run --skip-build PhotoPicVerify

      - name: Build & Package PhotoPic.dmg + OTA Zip
        run: |
          chmod +x macos/Scripts/package_macos_app.sh
          bash macos/Scripts/package_macos_app.sh

      - name: Upload macOS Installer & OTA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoPic-macOS-arm64
          path: |
            dist/PhotoPic-Installer.dmg
            dist/PhotoPic-macOS-arm64.zip

  windows:
    name: Windows (x64 EXE + Core Tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Windows Core Unit Tests
        run: |
          python -m unittest discover -s windows/tests -v

      - name: Build Standalone PhotoPic.exe
        shell: pwsh
        run: |
          ./windows/scripts/build_windows_exe.ps1
          Compress-Archive -Path "$env:GITHUB_WORKSPACE/dist/PhotoPic-Windows/*" -DestinationPath "$env:GITHUB_WORKSPACE/dist/PhotoPic-Windows-x64.zip" -Force

      - name: Upload Windows Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoPic-Windows-x64
          path: dist/PhotoPic-Windows-x64.zip

  publish_release:
    name: Cloud Release (OTA Appcast & Binaries)
    needs: [macos, windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Built Binaries
        uses: actions/download-artifact@v4
        with:
          pattern: PhotoPic-*
          merge-multiple: true
          path: release_assets

      - name: Generate latest.json Cloud Manifest & Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          ls -la release_assets
          BASE_VER=$(tr -d '[:space:]' < VERSION)
          BUILD_NUM=$(git rev-list --count HEAD)
          COMMIT_SHA=$(git rev-parse --short HEAD)
          TAG="v${BASE_VER}.${BUILD_NUM}"
          NOTES=$(git log -1 --pretty=%s)

          python3 - <<PY
          import datetime, hashlib, json, os, pathlib, subprocess

          assets = pathlib.Path("release_assets")
          repo = os.environ["REPO"]
          tag = "${TAG}"
          notes = subprocess.check_output(["git", "log", "-1", "--pretty=%s"], text=True).strip()

          def file_info(filename: str):
              p = assets / filename
              h = hashlib.sha256()
              with p.open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest(), p.stat().st_size

          mac_sha, mac_size = file_info("PhotoPic-macOS-arm64.zip")
          win_sha, win_size = file_info("PhotoPic-Windows-x64.zip")
          manifest = {
              "version": "${BASE_VER}.${BUILD_NUM}",
              "buildNumber": int("${BUILD_NUM}"),
              "commitSHA": "${COMMIT_SHA}",
              "publishedAt": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "releaseNotes": notes,
              "macosZipURL": f"https://github.com/{repo}/releases/download/{tag}/PhotoPic-macOS-arm64.zip",
              "macosSha256": mac_sha,
              "macosSizeBytes": mac_size,
              "macosDmgURL": f"https://github.com/{repo}/releases/download/{tag}/PhotoPic-Installer.dmg",
              "windowsZipURL": f"https://github.com/{repo}/releases/download/{tag}/PhotoPic-Windows-x64.zip",
              "windowsSha256": win_sha,
              "windowsSizeBytes": win_size,
          }
          (assets / "latest.json").write_text(json.dumps(manifest, indent=2), encoding="utf-8")
          print(json.dumps(manifest, indent=2))
          PY

          gh release delete "$TAG" -y 2>/dev/null || true
          gh release create "$TAG" \
            release_assets/latest.json \
            release_assets/PhotoPic-macOS-arm64.zip \
            release_assets/PhotoPic-Installer.dmg \
            release_assets/PhotoPic-Windows-x64.zip \
            --title "PhotoPic $TAG" \
            --notes "$NOTES (commit $COMMIT_SHA)" \
            --latest

          # Keep the latest 10 automated cloud releases to avoid cluttering GitHub Releases
          OLD_TAGS=$(gh release list --limit 30 --json tagName -q '.[10:][].tagName' || true)
          for old in $OLD_TAGS; do
            gh release delete "$old" -y --cleanup-tag || true
          done
