[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "photopic-windows"
version = "2.0.0"
description = "PhotoPic — Estudio nativo offline de tethering USB y culling RAW con IA para Windows 10/11"
readme = "../README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7.0",
    "rawpy>=0.23.0",
    "Pillow>=10.4.0",
    "pillow-heif>=0.18.0",
    "mediapipe>=0.10.14",
    "opencv-python-headless>=4.10.0",
    "numpy>=1.26.0",
]

[project.scripts]
photopic = "photopic_win.main:main"
